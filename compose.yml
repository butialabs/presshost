services:
  # PressHost
  presshost:
    image: ghcr.io/butialabs/presshost:latest
    container_name: presshost
    restart: unless-stopped
    environment:
      SITEURL: https://your-domain.xyz
      DB_NAME: presshost
      DB_USER: presshost
      DB_PASSWORD: p@ssw0rd
      DB_HOST: db
      TZ: UTC
      # SSL_CERT_PATH: /site/ssl/live/your-domain.xyz/fullchain.pem
      # SSL_PRIVATE_PATH: /site/ssl/live/your-domain.xyz/privkey.pem
      # SSL_TRUSTED_CERT_PATH: /site/ssl/live/your-domain.xyz/chain.pem
    volumes:
      - ./presshost/press:/site/press
      - ./presshost/uploads:/site/uploads
      - ./presshost/cache:/site/cache
      - ./presshost/logs:/site/logs
      - ./presshost/ssl:/site/ssl # or if use certbot ./presshost/certbot:/site/ssl
    networks:
      - presshost
    ports:
      - 80:80
      - 443:443
    depends_on:
      - db
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Database
  db:
    image: mariadb:11
    container_name: db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: p@ssw0rd
      MYSQL_DATABASE: presshost
      MYSQL_USER: presshost
      MYSQL_PASSWORD: p@ssw0rd
    volumes:
      - ./presshost/db/data:/var/lib/mysql
    networks:
      - presshost
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # SSL
  certbot-dns-cloudflare:
    container_name: certbot-dns-cloudflare
    image: serversideup/certbot-dns-cloudflare
    volumes:
      - /presshost/ssl:/etc/letsencrypt
    environment:
      CERTBOT_EMAIL: tecnologia@your-domain.xyz
      CERTBOT_DOMAINS: your-domain.xyz,www.your-domain.xyz
      CLOUDFLARE_API_TOKEN: p@ssw0rd

networks:
  presshost:
    name: presshost
