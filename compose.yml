services:
  # PressHost
  presshost:
    image: ghcr.io/butialabs/presshost:latest
    container_name: presshost
    restart: unless-stopped
    environment:
      SITEURL: ${SITEURL:-https://your-domain.xyz}
      DB_NAME: ${DB_NAME:-presshost}
      DB_USER: ${DB_USER:-presshost}
      DB_PASSWORD: ${DB_PASSWORD:-p@ssw0rd}
      DB_HOST: ${DB_HOST:-db}
      TZ: ${TZ:-UTC}
    volumes:
      - ./presshost/press:/site/press
      - ./presshost/uploads:/site/uploads
      - ./presshost/cache:/site/cache
      - ./presshost/logs:/site/logs
      - ./presshost/ssl:/site/ssl # or if use certbot ./presshost/certbot:/site/ssl
    networks:
      - presshost
    ports:
      - 80:80
      - 443:443
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/etc/s6-overlay/scripts/healthcheck-all"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Database
  db:
    image: mariadb:11.4
    container_name: db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-p@ssw0rd}
      MYSQL_DATABASE: ${DB_NAME:-presshost}
      MYSQL_USER: ${DB_USER:-presshost}
      MYSQL_PASSWORD: ${DB_PASSWORD:-p@ssw0rd}
    volumes:
      - ./presshost/db/data:/var/lib/mysql
    networks:
      - presshost
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  presshost:
    name: presshost
